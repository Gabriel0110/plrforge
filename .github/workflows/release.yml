name: Release preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact SemVer currently stored in all three application manifests
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-preview
  cancel-in-progress: false

jobs:
  quality:
    name: Validate v${{ inputs.version }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run metadata:build
      - id: version
        name: Verify release version
        run: node script/release.mjs verify --expected "${{ inputs.version }}"
      - run: npm run build
      - run: npm run test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  prepare:
    name: Create draft release
    needs: quality
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: v${{ needs.quality.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Create or verify draft
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "PlrForge $RELEASE_TAG Preview" \
            --draft \
            --prerelease \
            --notes-file - <<'EOF'
          ## Release preview

          Back up every character before editing it and keep Terraria closed while PlrForge is open.

          The universal macOS app is signed with a Developer ID Application certificate, notarized by Apple, and stapled for offline Gatekeeper verification. Windows installers are not yet code-signed and will show an unidentified-publisher warning.

          Review `COMPATIBILITY.md`, `RECOVERY.md`, and `SHA256SUMS.txt` before testing.
          EOF

  macos:
    name: Package signed macOS universal
    needs: [quality, prepare]
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: v${{ needs.quality.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install ASC CLI
        uses: rudrankriyam/setup-asc@5358c70a27a3f0d1517604b0f1fdc43e70c1cc4d
        with:
          version: 0.33.1
      - run: npm ci
      - run: npm run metadata:build
      - name: Confirm signing secrets are configured
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          for variable in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY_B64; do
            test -n "${!variable:-}" || { echo "Missing required secret: $variable" >&2; exit 1; }
          done
      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/plrforge-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERTIFICATE_PATH="$RUNNER_TEMP/plrforge-developer-id.p12"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F "Developer ID Application: JOHN GABRIEL TOMBERLIN (WSB2QDY3P7)"
      - name: Build Developer ID signed app and DMG
        uses: tauri-apps/tauri-action@v1
        env:
          APPLE_SIGNING_IDENTITY: "Developer ID Application: JOHN GABRIEL TOMBERLIN (WSB2QDY3P7)"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLRFORGE_GITHUB_REPOSITORY: ${{ github.repository }}
        with:
          args: --target universal-apple-darwin --bundles app,dmg
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          uploadWorkflowArtifacts: false
      - name: Notarize and staple macOS artifacts
        env:
          ASC_BYPASS_KEYCHAIN: "1"
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
        run: |
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/PlrForge.app"
          DMG="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -d "$APP"
          test -n "$DMG"
          asc notarization submit --file "$DMG" --wait --poll-interval 15s --timeout 1h --output json
          xcrun stapler staple "$APP"
          xcrun stapler staple "$DMG"
      - name: Validate Developer ID, Gatekeeper, notarization, and architectures
        run: |
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/PlrForge.app"
          DMG="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          node script/macos-artifact.mjs "$APP" --mode distribution --expect-arch arm64,x86_64 --dmg "$DMG"
      - name: Upload notarized macOS artifacts
        run: |
          BUNDLE_DIR="src-tauri/target/universal-apple-darwin/release/bundle"
          APP_TAR="$BUNDLE_DIR/PlrForge_${{ needs.quality.outputs.version }}_universal.app.tar.gz"
          DMG="$(find "$BUNDLE_DIR/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          tar -czf "$APP_TAR" -C "$BUNDLE_DIR/macos" PlrForge.app
          gh release upload "$RELEASE_TAG" "$APP_TAR" "$DMG" --clobber

  windows:
    name: Package Windows x64
    needs: [quality, prepare]
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: v${{ needs.quality.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run metadata:build
      - name: Build Windows installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLRFORGE_GITHUB_REPOSITORY: ${{ github.repository }}
        with:
          args: --bundles nsis,msi
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          uploadWorkflowArtifacts: false
      - name: Upload Windows installers
        shell: pwsh
        run: |
          $assets = @(
            Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi"
            Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe"
          )
          if ($assets.Count -ne 2) {
            throw "Expected one MSI and one NSIS installer, found $($assets.Count)."
          }
          foreach ($asset in $assets) {
            gh release upload $env:RELEASE_TAG $asset.FullName --clobber
          }

  finalize:
    name: Verify release assets
    needs: [quality, macos, windows]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: v${{ needs.quality.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Download uploaded bundles
        run: gh release download "$RELEASE_TAG" --dir release-assets
      - name: Validate bundles and generate SHA-256 manifest
        run: node script/release.mjs checksums release-assets --require .app.tar.gz,.dmg,.msi,.exe
      - name: Attach checksums and compatibility matrix
        run: gh release upload "$RELEASE_TAG" release-assets/SHA256SUMS.txt docs/COMPATIBILITY.md docs/RECOVERY.md --clobber
      - name: Confirm draft release state
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"
          gh release view "$RELEASE_TAG" --json url --jq '"Draft preview ready: " + .url'
