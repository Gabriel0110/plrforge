name: Release draft

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLRFORGE_GITHUB_REPOSITORY: ${{ github.repository }}
        with:
          tagName: v__VERSION__
          releaseName: PlrForge v__VERSION__
          releaseBody: Download the artifact for your platform. See the repository release notes and compatibility matrix before editing a character.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
